  h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
    color: #d71868;
    padding: 0 10px;
    text-shadow:
    -3px -3px 0 #fff,
     3px -3px 0 #fff,
    -3px  3px 0 #fff,
     3px  3px 0 #fff;
   position: relative;   /* ← добавили */
    z-index: 2;           /* ← выше конфетти */
  }

  .mini-confetti {
  position: fixed;
  width: 6px;
  height: 8px;
  pointer-events: none;
  z-index: 9999;
  animation: mini-confetti-pop 0.7s ease-out forwards;
}

@keyframes mini-confetti-pop {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate(
      calc(-50% + var(--dx)),
      calc(-50% + var(--dy))
    ) rotate(720deg);
    opacity: 0;
  }
}
  
  .sparkle {
  position: fixed;
  width: 8px;
  height: 8px;
  background: radial-gradient(circle, #fff 0%, #fcbf49 40%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;             /* поверх всего — искорки должны быть видны */
  animation: sparkle-fade 1.5s ease-out forwards;
}

@keyframes sparkle-fade {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(0) rotate(180deg);
    opacity: 0;
  }
}

/* Иногда искорки-звёздочки вместо кружков */
.sparkle.star {
  background: none;
  border-radius: 0;
  width: 12px;
  height: 12px;
}
.sparkle.star::before,
.sparkle.star::after {
  content: '';
  position: absolute;
  background: #fcbf49;
  box-shadow: 0 0 6px #fcbf49;
}
.sparkle.star::before {
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  transform: translateX(-50%);
}
.sparkle.star::after {
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  transform: translateY(-50%);
}

  .countdown {
  display: none;              /* ← скрыт по умолчанию */
  gap: 12px;
  margin-top: 25px;
  padding: 15px 20px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  position: relative;
  z-index: 2;
  flex-wrap: wrap;
  justify-content: center;
}

/* Класс, который добавляем из JS — показывает блок */
.countdown.visible {
  display: flex;
  animation: countdown-appear 0.8s ease-out;
}

@keyframes countdown-appear {
  0% {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.countdown-title {
  width: 100%;                 /* на всю ширину контейнера */
  text-align: center;
  font-size: 1.15em;
  font-weight: bold;
  color: #d71868;
  text-shadow:
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff;
  margin-bottom: 10px;
}

@media (max-width: 600px) {
  .countdown-title { font-size: 1em; margin-bottom: 8px; }
}

.countdown-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 60px;
}

.countdown-number {
  font-size: 2em;
  font-weight: bold;
  color: #d71868;
  text-shadow:
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff;
  line-height: 1;
}

.countdown-label {
  font-size: 0.85em;
  color: #654321;
  margin-top: 4px;
}

.countdown-finished {
  font-size: 1.4em;
  color: #d71868;
  font-weight: bold;
}

@media (max-width: 600px) {
  .countdown-number { font-size: 1.5em; }
  .countdown-label  { font-size: 0.75em; }
  .countdown        { gap: 8px; padding: 12px; }
  .countdown-item   { min-width: 50px; }
}

  .container {
    background: rgba(255,255,255,0.7);
    padding: 20px;
    border-radius: 15px;
    max-width: 90%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    position: relative;   /* ← добавили */
    z-index: 2;           /* ← выше конфетти */
  }

  .text {
    font-size: 1.2em;
    margin-bottom: 20px;
    min-height: 100px;
    color: #654321;
    white-space: pre-line;   /* ← чтобы \n работали */
    line-height: 1.5;        /* ← для читаемости */
  }

  button {
    padding: 14px 40px;
    font-size: 1em;
    font-family: 'AuktyonZW00-Regular', 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(180deg, #ffb0c6 0%, #fc89ac 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    position: relative;
    box-shadow:
    inset 0 -3px 0 rgba(0,0,0,0.1),
    inset 0 3px 6px rgba(255,255,255,0.5),
    0 4px 10px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow:
    inset 0 -3px 0 rgba(0,0,0,0.1),
    inset 0 3px 6px rgba(255,255,255,0.7),
    0 8px 18px rgba(0,0,0,0.2);
}

  .confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 14px;
  opacity: 0.9;
  z-index: 1;            /* ← было 9999, стало 1 */
  pointer-events: none;
  animation: confetti-fall linear forwards;
}
  

.confetti:nth-child(3n) { border-radius: 50%; }

@keyframes confetti-fall {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0.8;
  }
}

  @media(max-width: 600px){
    h1 {
      font-size: 2em;
    }
    .text {
      font-size: 1em;
    }
  }

.balloon {
  position: fixed;
  bottom: -100px;               /* стартуют за нижним краем */
  width: 40px;
  height: 50px;
  border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
  z-index: 1;                   /* как у конфетти — под текстом */
  pointer-events: none;
  opacity: 0.9;
  animation: balloon-rise linear forwards;
}

/* Нитка шарика */
.balloon::after {
  content: '';
  position: absolute;
  bottom: -18px;
  left: 50%;
  width: 1px;
  height: 20px;
  background: rgba(0, 0, 0, 0.35);
  transform: translateX(-50%);
}

/* Блик на шарике для объёма */
.balloon::before {
  content: '';
  position: absolute;
  top: 10px;
  left: 10px;
  width: 8px;
  height: 12px;
  background: rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  filter: blur(1px);
}

@keyframes balloon-rise {
  0% {
    transform: translateY(0) translateX(0) rotate(-3deg);
    opacity: 0;
  }
  10% {
    opacity: 0.95;
  }
  50% {
    transform: translateY(-55vh) translateX(20px) rotate(3deg);
  }
  100% {
    transform: translateY(-115vh) translateX(-15px) rotate(-3deg);
    opacity: 0.9;
  }
}

</style>
</head>
<body>

<h1 id="mainTitle"> Бэ-бэ-бу! </h1>
<!-- Тут изначально лепет, потом текст, по нажатию он менится -->

<div class="container">
  <div class="text" id="invitationText">
     Иии уаууууу Еииеиеи пффффф э А А А тртртртртр ням ням<br><br>оаоаоа бубубуб па бебебе пщпщпщптрпт<br><br>иуиуиуоо агагагагага ццццццц ааааааа фафафафафафа
  </div>
  <button id="toggleButton">Перевод с малышкового</button>
</div>

<div id="countdown" class="countdown">
  <div class="countdown-title">До праздника осталось:</div>
  <div class="countdown-item">
    <div class="countdown-number" id="days">00</div>
    <div class="countdown-label">дней</div>
  </div>
  <div class="countdown-item">
    <div class="countdown-number" id="hours">00</div>
    <div class="countdown-label">часов</div>
  </div>
  <div class="countdown-item">
    <div class="countdown-number" id="minutes">00</div>
    <div class="countdown-label">минут</div>
  </div>
  <div class="countdown-item">
    <div class="countdown-number" id="seconds">00</div>
    <div class="countdown-label">секунд</div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src='song.mp3'>

<script>

const sparkleColors = ['#fcbf49', '#ff6b6b', '#4ecdc4', '#ff8fab', '#a06cd5', '#95e06c'];

function createSparkle(x, y) {
  const sparkle = document.createElement('div');
  sparkle.classList.add('sparkle');

  // Случайно: кружок или звёздочка
  if (Math.random() < 0.3) {
    sparkle.classList.add('star');
  } else {
    // Случайный цвет для кружка
    const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
    sparkle.style.background = `radial-gradient(circle, #fff 0%, ${color} 40%, transparent 70%)`;
  }

  // Размер
  const size = 6 + Math.random() * 8;
  sparkle.style.width  = size + 'px';
  sparkle.style.height = size + 'px';

  // Позиция
  sparkle.style.left = x + 'px';
  sparkle.style.top  = y + 'px';

  // Небольшой разброс
  sparkle.style.marginLeft = (Math.random() - 0.5) * 10 + 'px';
  sparkle.style.marginTop  = (Math.random() - 0.5) * 10 + 'px';

  document.body.appendChild(sparkle);

  // Удаляем после анимации
  setTimeout(() => sparkle.remove(), 1500);
}

// Реакция на движение мышки (с ограничением, чтобы не спамить)
let lastSparkleTime = 0;
document.addEventListener('mousemove', (e) => {
  const now = Date.now();
  if (now - lastSparkleTime < 20) return; // не чаще, чем каждые 40 мс
  lastSparkleTime = now;
  createSparkle(e.clientX, e.clientY);
});

// Реакция на касания (для телефонов)
document.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  const now = Date.now();
  if (now - lastSparkleTime < 60) return;
  lastSparkleTime = now;
  createSparkle(touch.clientX, touch.clientY);
}, { passive: true });

// Искорка при клике — сразу несколько
document.addEventListener('click', (e) => {
  for (let i = 0; i < 8; i++) {
    setTimeout(() => createSparkle(
      e.clientX + (Math.random() - 0.5) * 40,
      e.clientY + (Math.random() - 0.5) * 40
    ), i * 30);
  }
});

const partyDate = new Date('2026-11-01T12:00:00').getTime();

function updateCountdown() {
  const now  = new Date().getTime();
  const diff = partyDate - now;

  const countdownEl = document.getElementById('countdown');

  // Если праздник уже наступил
  if (diff <= 0) {
    countdownEl.innerHTML = '<div class="countdown-finished">🎉 Праздник уже начался! 🎉</div>';
    clearInterval(countdownInterval);
    return;
  }

  const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById('days').textContent    = String(days).padStart(2, '0');
  document.getElementById('hours').textContent   = String(hours).padStart(2, '0');
  document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
  document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
}

// Запускаем сразу и обновляем каждую секунду
updateCountdown();
const countdownInterval = setInterval(updateCountdown, 1000);

  const titles = [
    "Бэ-бэ-бу!",
    "Приветули от Евули! ฅ^•ﻌ•^ฅ"
  ];

  const texts = [
    "Иии уаууууу Еииеиеи пффффф э А А А тртртртртр ням ням,\nоаоаоа бубубуб па бебебе пщпщпщптрпт,\nиуиуиуоо агагагагага ццццццц ааааааа фафафафафафа",
    "Приглашаю вас на мой первый День Рождения! 🎊🎊🎊\nМне уже целый годик 🥳 и я такая радая 🐱, поэтому хочу разделить эту радость с вами 🎉\n\n🕛Жду вас 1 ноября в 12:00🕛\n🏠По адресу: ул. Ленинского Комсомола д.38 кв.96🏠\n\n🤗Захватите с собой улыбки и хорошее настроение 🤗\n💞Целую по-малышьи 💞! Жду 💖\n\nP.S. Условие то же: главное — не балейти ʕ•́ᴥ•̀ʔ"
  ];

  const button  = document.getElementById('toggleButton');
  const textDiv = document.getElementById('invitationText');
  const titleEl = document.getElementById('mainTitle');
  const music   = document.getElementById('bgMusic');

  let isSecondText  = false;
  let isSecondTitle = false;
  let confettiInterval = null;
  let confettiStarted  = false;
  let musicPlaying     = false;

  let balloonInterval = null;
let balloonsStarted = false;

function spawnBalloon() {
  const colors = [
    '#ff6b6b', // красный
    '#4ecdc4', // бирюзовый
    '#fcbf49', // жёлтый
    '#a06cd5', // фиолетовый
    '#ff8fab', // розовый
    '#95e06c'  // зелёный
  ];

  const balloon = document.createElement('div');
  balloon.classList.add('balloon');

  // Случайная позиция по ширине
  balloon.style.left = Math.random() * 100 + 'vw';

  // Случайный цвет
  balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

  // Случайный размер
  const width  = 30 + Math.random() * 25;    // 30–55 px
  const height = width * 1.25;               // пропорции
  balloon.style.width  = width + 'px';
  balloon.style.height = height + 'px';

  // Случайная скорость подъёма
  const duration = 6 + Math.random() * 4;    // 6–10 секунд
  const delay    = Math.random() * 1.5;      // 0–1.5 сек задержка
  balloon.style.animationDuration = duration + 's';
  balloon.style.animationDelay    = delay + 's';

  document.body.appendChild(balloon);

  // Удаляем после завершения анимации
  setTimeout(() => balloon.remove(), (duration + delay) * 1000);
}

function startBalloons() {
  if (balloonsStarted) return;
  balloonsStarted = true;

  // Стартовая партия — 8 шариков сразу
  for (let i = 0; i < 8; i++) spawnBalloon();

  // Дальше — по 1 шарику каждые ~800 мс
  balloonInterval = setInterval(() => {
    spawnBalloon();
  }, 800);
}

  function spawnConfettiPiece() {
    const colors = ['#fcbf49','#f29d2f','#ff6b6b','#4ecdc4','#a06cd5','#ff8fab','#95e06c'];
    const piece = document.createElement('div');
    piece.classList.add('confetti');

    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

    const size = 6 + Math.random() * 8;
    piece.style.width  = size + 'px';
    piece.style.height = (size * 1.4) + 'px';

    const duration = 3.5 + Math.random() * 2;
    const delay    = Math.random() * 0.3;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay    = delay + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + delay) * 1000);
  }

  function startConfetti() {
    if (confettiStarted) return;
    confettiStarted = true;

    for (let i = 0; i < 120; i++) spawnConfettiPiece();

    confettiInterval = setInterval(() => {
      for (let i = 0; i < 6; i++) spawnConfettiPiece();
    }, 150);
  }

  
  let musicStarted = false;

button.addEventListener('click', () => {
  if (!isSecondText) {
    startConfetti();
    startBalloons();

    // Музыка запускается ТОЛЬКО один раз и больше не переключается
    if (!musicStarted) {
      music.volume = 0.4;
      music.play().catch(err => console.log('Не удалось воспроизвести:', err));
      musicStarted = true;
    }

    document.getElementById('countdown').classList.add('visible');

    textDiv.innerHTML = texts[1];
    button.innerText  = 'Вернуться к малышковому';
  } else {
    // Обратный клик — только меняем текст, музыку не трогаем
    textDiv.innerHTML = texts[0];
    button.innerText  = 'Перевод с малышкового';
  }
  isSecondText = !isSecondText;

  if (!isSecondTitle) {
    titleEl.innerHTML = titles[1];
  } else {
    titleEl.innerHTML = titles[0];
  }
  isSecondTitle = !isSecondTitle;
});

const miniConfettiColors = ['#fcbf49', '#f29d2f', '#ff6b6b', '#4ecdc4', '#a06cd5', '#ff8fab', '#95e06c'];

function miniConfettiBurst(x, y) {
  const count = 12; // сколько частиц

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.classList.add('mini-confetti');

    // Случайный цвет
    piece.style.backgroundColor = miniConfettiColors[Math.floor(Math.random() * miniConfettiColors.length)];

    // Позиция — точка наведения
    piece.style.left = x + 'px';
    piece.style.top  = y + 'px';

    // Направление разлёта (равномерно по кругу + случайность)
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const distance = 40 + Math.random() * 40; // 40–80 px
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;

    piece.style.setProperty('--dx', dx + 'px');
    piece.style.setProperty('--dy', dy + 'px');

    // Случайный размер
    const size = 5 + Math.random() * 5;
    piece.style.width  = size + 'px';
    piece.style.height = (size * 1.4) + 'px';

    document.body.appendChild(piece);

    // Удаляем после анимации
    setTimeout(() => piece.remove(), 700);
  }
}

let lastBurstTime = 0;

button.addEventListener('mouseenter', (e) => {
  const now = Date.now();
  if (now - lastBurstTime < 300) return; // не чаще чем раз в 300 мс
  lastBurstTime = now;

  // Взрыв в точке, где находится курсор
  miniConfettiBurst(e.clientX, e.clientY);
});

button.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  miniConfettiBurst(touch.clientX, touch.clientY);
}, { passive: true });


</script>

</body>
</html>
